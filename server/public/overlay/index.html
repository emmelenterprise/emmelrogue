<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmmelRogue Race</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="overlay" class="overlay">

    <!-- Row 1: Spieler 1 -->
    <div class="row" id="row-1">
      <div class="cam-slot" id="cam-slot-1">
        <video id="cam-1" autoplay playsinline muted></video>
        <div class="slot-placeholder" id="placeholder-cam-1">
          <div class="placeholder-label">CAM</div>
        </div>
      </div>
      <div class="game-slot" id="game-slot-1">
        <video id="game-1" autoplay playsinline muted></video>
        <iframe id="game-iframe-1" class="game-iframe hidden" allow="camera;microphone;autoplay;gamepad" allowfullscreen></iframe>
        <div class="slot-placeholder" id="placeholder-game-1">
          <div class="placeholder-label">Warte auf Spieler 1...</div>
        </div>
        <!-- Player HUD overlay -->
        <div class="player-hud" id="hud-1">
          <span class="hud-name" id="hud-name-1">Spieler 1</span>
          <span class="hud-wave" id="hud-wave-1">Wave 0</span>
          <span class="hud-status" id="hud-status-1"></span>
        </div>
      </div>
      <div class="community-slot hidden" id="community-slot-1">
        <iframe id="community-iframe-1" class="community-iframe" allow=""></iframe>
      </div>
    </div>

    <!-- 1px Separator -->
    <div class="separator"></div>

    <!-- Row 2: Spieler 2 -->
    <div class="row" id="row-2">
      <div class="cam-slot" id="cam-slot-2">
        <video id="cam-2" autoplay playsinline muted></video>
        <div class="slot-placeholder" id="placeholder-cam-2">
          <div class="placeholder-label">CAM</div>
        </div>
      </div>
      <div class="game-slot" id="game-slot-2">
        <video id="game-2" autoplay playsinline muted></video>
        <iframe id="game-iframe-2" class="game-iframe hidden" allow="camera;microphone;autoplay;gamepad" allowfullscreen></iframe>
        <div class="slot-placeholder" id="placeholder-game-2">
          <div class="placeholder-label">Warte auf Spieler 2...</div>
        </div>
        <!-- Player HUD overlay -->
        <div class="player-hud" id="hud-2">
          <span class="hud-name" id="hud-name-2">Spieler 2</span>
          <span class="hud-wave" id="hud-wave-2">Wave 0</span>
          <span class="hud-status" id="hud-status-2"></span>
        </div>
      </div>
      <div class="community-slot hidden" id="community-slot-2">
        <iframe id="community-iframe-2" class="community-iframe" allow=""></iframe>
      </div>
    </div>

    <!-- Timer overlay (centered between rows) -->
    <div class="timer-overlay" id="timer-overlay">
      <span id="hud-timer">00:00</span>
    </div>

    <!-- Finish Banner (hidden by default) -->
    <div class="finish-banner hidden" id="finish-banner">
      <div class="finish-text" id="finish-text">SPIELER GEWINNT!</div>
      <div class="finish-sub" id="finish-sub"></div>
      <button class="btn-lobby hidden" id="btn-lobby">Zurück zur Lobby</button>
    </div>
  </div>

  <!-- Debug (hidden by default) -->
  <div id="debug" class="debug hidden">
    <span id="debug-text">Connecting...</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
